<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Keyboard Test · 键盘按键测试</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --key: #1e222b;
    --key-border: #2c313d;
    --text: #e8eaf0;
    --dim: #8a91a3;
    --accent: #4f8cff;
    --accent-glow: rgba(79, 140, 255, .55);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    overflow-x: hidden;
  }
  header { text-align: center; margin-bottom: 12px; }
  header h1 { font-size: 22px; margin: 0 0 6px; }
  header p { color: var(--dim); font-size: 14px; margin: 0; }
  header p b { color: var(--accent); }

  #display {
    width: 100%;
    max-width: 640px;
    background: var(--panel);
    border: 1px solid var(--key-border);
    border-radius: 16px;
    padding: 22px 20px 18px;
    text-align: center;
    margin-bottom: 16px;
  }
  #bigKey {
    font-family: var(--mono);
    font-size: 46px;
    font-weight: 700;
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    word-break: break-all;
    margin-bottom: 14px;
  }
  #bigKey.hit { color: var(--accent); text-shadow: 0 0 18px var(--accent-glow); }
  #bigKey.idle { color: var(--dim); font-size: 20px; font-weight: 400; }
  #meta {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 8px;
  }
  #meta > div {
    background: var(--bg);
    border-radius: 10px;
    padding: 8px 10px;
    text-align: left;
  }
  #meta span { display: block; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  #meta code { font-family: var(--mono); font-size: 14px; }

  #keyboard {
    width: 100%;
    max-width: 980px;
    background: var(--panel);
    border: 1px solid var(--key-border);
    border-radius: 16px;
    padding: 14px;
    overflow-x: auto;
    margin-bottom: 16px;
  }
  #kbInner { min-width: 780px; display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
  .krow { display: flex; gap: 5px; width: 100%; }
  .key {
    background: var(--key);
    border: 1px solid var(--key-border);
    border-bottom-width: 3px;
    border-radius: 6px;
    height: 40px;
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--dim);
    transition: background .05s;
    white-space: nowrap;
    overflow: hidden;
    padding: 0 2px;
  }
  .key.fn { height: 32px; flex: 0 0 44px; }
  .key.w15 { flex: 1.5 0 0; }
  .key.w2 { flex: 2 0 0; }
  .key.w225 { flex: 2.25 0 0; }
  .key.w275 { flex: 2.75 0 0; }
  .key.space { flex: 6.25 0 0; }
  .key.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 14px var(--accent-glow);
    transform: translateY(1px);
    border-bottom-width: 2px;
  }
  .navblock { display: flex; gap: 14px; margin-top: 8px; width: 100%; justify-content: center; }
  .navcol { display: flex; flex-direction: column; gap: 5px; }
  .navcol .krow { width: 180px; }
  .navcol .key { flex: 1 1 0; }

  #historySec {
    width: 100%;
    max-width: 640px;
    background: var(--panel);
    border: 1px solid var(--key-border);
    border-radius: 16px;
    padding: 16px 20px;
  }
  #historySec h2 { font-size: 15px; margin: 0 0 10px; color: var(--dim); font-weight: 600; }
  #histList { list-style: none; margin: 0; padding: 0; font-family: var(--mono); font-size: 13px; }
  #histList li {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 5px 0;
    border-bottom: 1px dashed var(--key-border);
  }
  #histList li:last-child { border-bottom: none; }
  #histList .hk { color: var(--accent); min-width: 90px; }
  #histList .hc { color: var(--dim); flex: 1; text-align: right; }
  #clearBtn {
    margin-top: 12px;
    background: var(--key);
    color: var(--dim);
    border: 1px solid var(--key-border);
    border-radius: 8px;
    padding: 7px 18px;
    font-size: 13px;
    cursor: pointer;
  }
  #clearBtn:hover { color: var(--text); border-color: var(--accent); }
  #touchNote { display: none; color: var(--dim); font-size: 13px; margin-top: 10px; }
  @media (pointer: coarse) { #touchNote { display: block; } }
</style>
</head>
<body>
<header>
  <h1>⌨️ 键盘按键测试</h1>
  <p>按下任意键，看它是否被正确识别 · 已按键 <b id="count">0</b> 次（Esc 清空）</p>
  <p id="touchNote">这个页面需要物理键盘，手机上只能看到布局演示</p>
</header>

<section id="display">
  <div id="bigKey" class="idle">按任意键开始</div>
  <div id="meta">
    <div><span>key</span><code id="mKey">—</code></div>
    <div><span>code</span><code id="mCode">—</code></div>
    <div><span>keyCode</span><code id="mKc">—</code></div>
    <div><span>修饰键</span><code id="mMod">—</code></div>
  </div>
</section>

<section id="keyboard"><div id="kbInner"></div></section>

<section id="historySec">
  <h2>按键历史（最近 30 条）</h2>
  <ol id="histList"></ol>
  <button id="clearBtn" type="button">清空记录</button>
</section>

<script>
(function () {
  'use strict';

  // 键盘布局：每行按 flex 单位宽度排列，data-code 对应 KeyboardEvent.code
  var LAYOUT = [
    { keys: [['Escape','Esc','fn'],['F1','F1','fn'],['F2','F2','fn'],['F3','F3','fn'],['F4','F4','fn'],['F5','F5','fn'],['F6','F6','fn'],['F7','F7','fn'],['F8','F8','fn'],['F9','F9','fn'],['F10','F10','fn'],['F11','F11','fn'],['F12','F12','fn']] },
    { keys: [['Backquote','`'],['Digit1','1'],['Digit2','2'],['Digit3','3'],['Digit4','4'],['Digit5','5'],['Digit6','6'],['Digit7','7'],['Digit8','8'],['Digit9','9'],['Digit0','0'],['Minus','-'],['Equal','='],['Backspace','⌫','w2']] },
    { keys: [['Tab','Tab','w15'],['KeyQ','Q'],['KeyW','W'],['KeyE','E'],['KeyR','R'],['KeyT','T'],['KeyY','Y'],['KeyU','U'],['KeyI','I'],['KeyO','O'],['KeyP','P'],['BracketLeft','['],['BracketRight',']'],['Backslash','\\','w15']] },
    { keys: [['CapsLock','Caps','w2'],['KeyA','A'],['KeyS','S'],['KeyD','D'],['KeyF','F'],['KeyG','G'],['KeyH','H'],['KeyJ','J'],['KeyK','K'],['KeyL','L'],['Semicolon',';'],['Quote',"'"],['Enter','Enter','w2']] },
    { keys: [['ShiftLeft','Shift','w225'],['KeyZ','Z'],['KeyX','X'],['KeyC','C'],['KeyV','V'],['KeyB','B'],['KeyN','N'],['KeyM','M'],['Comma',','],['Period','.'],['Slash','/'],['ShiftRight','Shift','w225']] },
    { keys: [['ControlLeft','Ctrl','w15'],['MetaLeft','Win','w15'],['AltLeft','Alt','w15'],['Space','','space'],['AltRight','Alt','w15'],['MetaRight','Win','w15'],['ContextMenu','☰','w15'],['ControlRight','Ctrl','w15']] }
  ];
  var NAV_LAYOUT = [
    [['Insert','Ins'],['Home','Home'],['PageUp','PgUp']],
    [['Delete','Del'],['End','End'],['PageDown','PgDn']],
    [['', '', 'sp'],['ArrowUp','↑'],['', '', 'sp']],
    [['ArrowLeft','←'],['ArrowDown','↓'],['ArrowRight','→']]
  ];

  var kbInner = document.getElementById('kbInner');
  var codeToEl = {};

  function makeKey(code, label, widthClass) {
    var el = document.createElement('div');
    el.className = 'key' + (widthClass ? ' ' + widthClass : '');
    el.dataset.code = code;
    el.textContent = label;
    codeToEl[code] = el;
    return el;
  }

  LAYOUT.forEach(function (row) {
    var r = document.createElement('div');
    r.className = 'krow';
    row.keys.forEach(function (k) { r.appendChild(makeKey(k[0], k[1], k[2])); });
    kbInner.appendChild(r);
  });

  var navBlock = document.createElement('div');
  navBlock.className = 'navblock';
  var navCol = document.createElement('div');
  navCol.className = 'navcol';
  NAV_LAYOUT.forEach(function (rowKeys) {
    var r = document.createElement('div');
    r.className = 'krow';
    rowKeys.forEach(function (k) {
      if (!k[0]) { // 空占位：透明 spacer，只占位不显示
        var sp = document.createElement('div');
        sp.className = 'key sp';
        sp.style.visibility = 'hidden';
        r.appendChild(sp);
        return;
      }
      r.appendChild(makeKey(k[0], k[1], k[2]));
    });
    navCol.appendChild(r);
  });
  navBlock.appendChild(navCol);
  kbInner.appendChild(navBlock);

  var bigKey = document.getElementById('bigKey');
  var mKey = document.getElementById('mKey');
  var mCode = document.getElementById('mCode');
  var mKc = document.getElementById('mKc');
  var mMod = document.getElementById('mMod');
  var countEl = document.getElementById('count');
  var histList = document.getElementById('histList');
  var clearBtn = document.getElementById('clearBtn');

  var count = 0;
  var history = [];

  function keyLabel(e) {
    if (e.key === ' ') return 'Space';
    if (e.key.length === 1) return e.key.toUpperCase();
    var map = {
      Control: 'Ctrl', Meta: 'Win/Cmd', Alt: 'Alt', Shift: 'Shift',
      Escape: 'Esc', ArrowUp: '↑', ArrowDown: '↓', ArrowLeft: '←', ArrowRight: '→',
      Backspace: '⌫ Backspace', Enter: 'Enter', Tab: 'Tab', CapsLock: 'CapsLock',
      Delete: 'Del', Insert: 'Ins', Home: 'Home', End: 'End',
      PageUp: 'PageUp', PageDown: 'PageDown', ContextMenu: 'Menu'
    };
    return map[e.key] || e.key;
  }

  function modList(e) {
    var m = [];
    if (e.ctrlKey) m.push('Ctrl');
    if (e.altKey) m.push('Alt');
    if (e.shiftKey) m.push('Shift');
    if (e.metaKey) m.push('Meta');
    return m.length ? m.join(' + ') : '—';
  }

  function renderHistory() {
    histList.textContent = '';
    history.forEach(function (h) {
      var li = document.createElement('li');
      var hk = document.createElement('span');
      hk.className = 'hk';
      hk.textContent = h.k;
      var hc = document.createElement('span');
      hc.className = 'hc';
      hc.textContent = h.c + ' · ' + h.kc;
      li.appendChild(hk);
      li.appendChild(hc);
      histList.appendChild(li);
    });
  }

  // 放行不拦截的组合：Ctrl/Meta/Alt 组合、F5/F11/F12，保住刷新、devtools、切窗口
  function shouldPassThrough(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return true;
    return ['F5', 'F11', 'F12'].indexOf(e.key) !== -1;
  }

  window.addEventListener('keydown', function (e) {
    if (!shouldPassThrough(e)) e.preventDefault();

    var label = keyLabel(e);
    bigKey.textContent = label;
    bigKey.className = 'hit';
    mKey.textContent = e.key === ' ' ? '" "' : e.key;
    mCode.textContent = e.code || '—';
    mKc.textContent = String(e.keyCode);
    mMod.textContent = modList(e);

    count++;
    countEl.textContent = count;
    history.unshift({ k: label, c: e.code || '?', kc: String(e.keyCode) });
    if (history.length > 30) history.pop();
    renderHistory();

    var el = codeToEl[e.code];
    if (el) el.classList.add('active');
  });

  window.addEventListener('keyup', function (e) {
    var el = codeToEl[e.code];
    if (el) el.classList.remove('active');
  });

  // 窗口失焦时清掉所有卡住的高亮（Alt+Tab 时 keyup 收不到）
  window.addEventListener('blur', function () {
    Object.keys(codeToEl).forEach(function (c) { codeToEl[c].classList.remove('active'); });
  });

  function clearAll() {
    count = 0;
    history = [];
    countEl.textContent = '0';
    histList.textContent = '';
    bigKey.textContent = '按任意键开始';
    bigKey.className = 'idle';
    mKey.textContent = '—';
    mCode.textContent = '—';
    mKc.textContent = '—';
    mMod.textContent = '—';
  }
  clearBtn.addEventListener('click', clearAll);
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') clearAll();
  });
})();
</script>
</body>
</html>
